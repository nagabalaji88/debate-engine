[workspace]
resolver = "3"
members = [
    "crates/arbiter-core",
    "crates/arbiter-store",
    "crates/arbiter-kernel",
    "crates/arbiter-providers",
    "crates/arbiter-plugin",
    "crates/arbiter-cli",
    "crates/arbiter-fixtures",
    "crates/arbiter-build",
    "crates/arbiter-workspace-checks",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
# core, and everything that depends on it
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

# store: SQLite embedded, bundled so the binary has no host dependency (ARCHITECTURE §16)
rusqlite = { version = "0.32", features = ["bundled"] }
# store: RFC3339 timestamps for run/schema_metadata rows (`run.started_at`, etc.) —
# std has no calendar formatting, and every store row genuinely needs a real one.
time = { version = "0.3", features = ["formatting"] }

# kernel: async runtime + HTTPS + SSE parsing for provider streaming. "net" is
# `arbiter serve`'s own addition (U1) -- the loopback-only TCP listener.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
# `rustls-tls-native-roots`, not plain `rustls-tls`: the latter trusts only
# the Mozilla roots compiled into webpki-roots and ignores the machine's own
# trust store, so every provider call fails with `UnknownIssuer` behind a
# corporate TLS-inspecting proxy -- a configuration a desktop CLI meets
# routinely, and one the operator cannot fix without recompiling. Reading the
# OS store makes an administrator-installed root work the way it does for
# curl and every browser on the same machine.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
eventsource-stream = "0.2"
# kernel: manifest.toml for prompt packs (ARCHITECTURE §15, INTERFACES §23)
toml = "0.8"
# kernel: bounded concurrent fan-out inside a stage (INTERFACES §6: "concurrency
# lives inside stages, not across them" -- positions.generate/claims.extract/
# challenge.run each need this). Just the stream combinators, not the full
# `futures` metapackage.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# cross-cutting
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# providers: credential handling (ARCHITECTURE §11.1, INTERFACES §25). `zeroize`
# is how `SecretString` clears its buffer on drop without `unsafe` (forbidden
# workspace-wide) — hand-rolling safe, guaranteed zeroing of a `String`'s heap
# buffer isn't possible without it. `keyring` is the one cross-platform crate
# that reaches macOS Keychain / Linux Secret Service / Windows Credential
# Manager behind one API, matching source 3 of §11.1's resolution order.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
keyring = { version = "4", default-features = false, features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }

# cli
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# cli: arbiter serve (U1, ARCHITECTURE §17.1) -- the loopback-only HTTP server
# and its SSE stream. `getrandom` alone (not the full `rand` crate) mints the
# per-process 128-bit admission token: one OS-random fill, nothing else here
# needs a general-purpose RNG.
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
getrandom = "0.2"
# cli tests: U2-U7's own real-browser UI suite (`cargo test -p arbiter-cli
# --test ui`), driven against the sandbox's pre-installed Chromium via CDP
# directly -- no Node.js/npm involved, so the suite stays Cargo-native and
# reproducible in CI the same way every other test here is (PLAN_DEVIATIONS.md
# D49 covers why this is `chromiumoxide`, not a literal "Playwright" binding).
chromiumoxide = "0.9"

# plugin host: wasmtime, added when the 1.5 WASM-host task starts (out of
# this plan's scope, ARCHITECTURE.md §19 / IMPLEMENTATION_PLAN.md §9) —
# an unused heavy dependency has no place in the workspace yet.

# workspace-internal crates, so every crate names its siblings the same way
arbiter-core = { path = "crates/arbiter-core" }
arbiter-store = { path = "crates/arbiter-store" }
arbiter-kernel = { path = "crates/arbiter-kernel" }
arbiter-providers = { path = "crates/arbiter-providers" }
arbiter-plugin = { path = "crates/arbiter-plugin" }

[profile.release]
lto = true
codegen-units = 1

[profile.dev.package.rusqlite]
# bundled SQLite is unusably slow unopt in dev builds; this keeps `cargo test` fast
opt-level = 3
