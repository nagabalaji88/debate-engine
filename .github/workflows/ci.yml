name: CI

on:
  # Every branch, not just `main`. The filter used to be `branches: [main]`
  # while all the work happened on `claude/...` branches, so CI had never
  # actually run: the Actions API reported zero workflow runs for the
  # repository. A gate nobody has seen go green is not a gate.
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # ARCHITECTURE.md §18: CI proves the engine with zero LLM tokens. No network
      # credentials exist in this job, so a test that needs one fails loudly.
      # The browser tests drive a real Chromium over CDP. Without this step
      # they were passing only on a machine that happened to have one at
      # `/opt/pw-browsers/chromium`; `ARBITER_CHROMIUM` lets the test find
      # whatever this runner installed instead of hard-coding that path.
      - name: install chromium
        run: |
          npx --yes playwright@1.49.0 install --with-deps chromium
          echo "ARBITER_CHROMIUM=$(node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: test
        run: cargo test --workspace --all-features
