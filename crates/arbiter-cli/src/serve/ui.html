  :root {
    --page:#F7F8FB; --surface:#FFFFFF; --surface-2:#F0F2F8; --surface-3:#E7EAF3; --border:#E2E5EE;
    --ink:#1B2030; --ink-2:#5B6272; --ink-muted:#8890A0;
    --accent:#5B63E8; --accent-2:#4247B8; --accent-ink:#FFFFFF;
    --good:#0a8a3f; --warn:#a86a00; --bad:#c0392b; --code-bg:#F5F6FA;
    /* One colour per provider, used for its card, its bar and its lane, so a
       model is the same colour everywhere it appears. */
    --anthropic:#2a78d6; --openai:#eb6834; --gemini:#1baf7a; --xai:#eda100; --deepseek:#e87ba4; --openrouter:#7a5af0; --groq:#d4552e; --mock:#78809a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page:#0B0E14; --surface:#131720; --surface-2:#1A2030; --surface-3:#232A3D; --border:#262C3D;
      --ink:#ECEEF6; --ink-2:#A7ADC0; --ink-muted:#6E7488;
      --accent:#7C83FF; --accent-2:#5B63E8; --accent-ink:#0B0E14;
      --good:#3ddc84; --warn:#f0b429; --bad:#e66767; --code-bg:#0E1220;
      --anthropic:#3987e5; --openai:#f0703c; --gemini:#199e70; --xai:#c98500; --deepseek:#d55181; --openrouter:#8e72ff; --groq:#e0663f; --mock:#8a92aa;
    }
  }
  :root[data-theme="dark"] {
    --page:#0B0E14; --surface:#131720; --surface-2:#1A2030; --surface-3:#232A3D; --border:#262C3D;
    --ink:#ECEEF6; --ink-2:#A7ADC0; --ink-muted:#6E7488;
    --accent:#7C83FF; --accent-2:#5B63E8; --accent-ink:#0B0E14;
    --good:#3ddc84; --warn:#f0b429; --bad:#e66767; --code-bg:#0E1220;
    --anthropic:#3987e5; --openai:#f0703c; --gemini:#199e70; --xai:#c98500; --deepseek:#d55181; --openrouter:#8e72ff; --groq:#e0663f; --mock:#8a92aa;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-family: "Sora", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  code { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: .92em; }
  button, input, select, textarea { font-family: inherit; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

  .topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px;
    padding: 12px 24px; background: var(--page); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; flex-shrink: 0; text-decoration: none; color: var(--ink); }
  .brand .mark { width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    background: linear-gradient(155deg, var(--anthropic), var(--deepseek) 33%, var(--xai) 66%, var(--gemini)); }
  .tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; flex-wrap: wrap; }
  .tab-btn { border: none; background: transparent; color: var(--ink-2); font-size: 13.5px; font-weight: 600;
    padding: 7px 15px; border-radius: 8px; cursor: pointer; text-decoration: none; display: inline-block; }
  .tab-btn[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .topbar .spacer { flex: 1; }
  .run-status { font-size: 12.5px; color: var(--ink-muted); display: flex; align-items: center; gap: 6px; }
  .run-status .sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-muted); }
  .run-status.live .sdot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); }

  main { max-width: 1320px; margin: 0 auto; padding: 24px 24px 80px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -.01em; }
  h2 { font-size: 15px; margin: 24px 0 10px; }
  .sub { color: var(--ink-2); font-size: 13px; margin: 0 0 20px; }
  .label { font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
  .panel { padding: 16px 18px; }
  .panel .ptitle { font-weight: 600; font-size: 13.5px; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
  .muted { color: var(--ink-muted); }
  .stack { display: flex; flex-direction: column; gap: 16px; }
  .section-gap { margin-top: 22px; }

  label { display: block; font-weight: 600; font-size: 12.5px; margin-bottom: 5px; }
  textarea, input[type=text], input[type=number], select {
    width: 100%; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2);
    color: var(--ink); font: inherit; font-size: 13px; padding: 9px 10px;
  }
  textarea { min-height: 84px; resize: vertical; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border: none; border-radius: 9px;
    font-weight: 600; font-size: 13.5px; padding: 9px 18px; cursor: pointer; white-space: nowrap; }
  .btn-primary:disabled { opacity: .55; cursor: default; }
  .btn-primary:not(:disabled):hover { background: var(--accent-2); color: #fff; }
  button.ghost { background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px;
    font-size: 13px; font-weight: 500; padding: 8px 14px; cursor: pointer; }
  button.link { border: none; background: none; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: 13px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > * { flex: 1 1 200px; }

  /* Image 1: a coloured card per model, showing who is on the roster and
     whether it can actually run. */
  .model-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .model-card { border-radius: 14px; padding: 13px 14px; color: #fff; position: relative; overflow: hidden; min-height: 72px;
    display: flex; flex-direction: column; justify-content: center; }
  .model-card::after { content:""; position:absolute; inset:0; background: linear-gradient(155deg, rgba(255,255,255,.16), rgba(0,0,0,.10)); }
  .model-card > * { position: relative; }
  .model-card .top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
  .model-card .idot { width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: .9; flex: none; }
  .model-card .nm { font-weight: 700; font-size: 14.5px; }
  .model-card .ver { font-size: 10.5px; opacity: .85; font-family: "IBM Plex Mono", monospace; }
  .model-card .desc { font-size: 11.5px; opacity: .93; line-height: 1.35; }
  .model-card.unusable { filter: grayscale(.65); opacity: .55; }

  .split { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }

  /* Image 5: one response card per model, laid out side by side. */
  .resp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .resp-card { display: flex; flex-direction: column; overflow: hidden; min-width: 0; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; }
  .resp-card .rhead { padding: 10px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .resp-card .rhead .nm { font-size: 12.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .resp-card .rhead .rdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .resp-card .rbody { flex: 1; min-height: 150px; max-height: 320px; overflow: auto; background: var(--code-bg); }
  .resp-card .answer { margin: 0; padding: 10px 12px; font-size: 11.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere;
    font-family: "IBM Plex Mono", monospace; }
  .resp-card .rfoot { padding: 7px 12px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
  .resp-card .rmeta { font-size: 9.5px; color: var(--ink-muted); font-family: "IBM Plex Mono", monospace; }
  .resp-card.is-skipped { opacity: .62; }
  .resp-card.is-error { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); }
  .stage-txt { font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; font-family: "IBM Plex Mono", monospace; color: var(--ink-muted); flex-shrink: 0; }
  .stage-txt.on { color: var(--accent); } .stage-txt.ok { color: var(--good); } .stage-txt.err { color: var(--bad); }
  .empty-note { font-size: 11.5px; color: var(--ink-muted); padding: 12px; }

  /* Image 2 & 3: the pipeline as a stepper, one node per stage. */
  .flow-wrap { padding: 22px 20px; overflow-x: auto; }
  .stepper { display: flex; align-items: flex-start; min-width: 900px; }
  .step { display: flex; flex-direction: column; align-items: center; flex: 1; position: relative; }
  .step .dot2 { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 10.5px; font-weight: 700; z-index: 1; font-family: "IBM Plex Mono", monospace; }
  .step .lbl2 { font-size: 10.5px; margin-top: 8px; text-align: center; max-width: 92px; color: var(--ink-2); line-height: 1.3; }
  .step .line { position: absolute; top: 12px; left: 50%; width: 100%; height: 2px; background: var(--border); z-index: 0; }
  .step:last-child .line { display: none; }
  .step.done .dot2 { background: var(--good); color: #fff; }
  .step.done .line { background: var(--good); }
  .step.active .dot2 { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 25%, transparent); }
  .step.active .lbl2 { color: var(--ink); font-weight: 600; }
  .step.pending .dot2 { background: var(--surface); border: 2px solid var(--border); color: var(--ink-muted); }

  /* Image 4: usage — stat tiles above, one bar per model below. */
  .stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat { padding: 16px 18px; }
  .stat .k { font-size: 12px; color: var(--ink-2); margin-bottom: 8px; }
  .stat .v { font-size: 23px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat .v .unit { font-size: 12.5px; font-weight: 500; color: var(--ink-muted); }
  .stat.accent { background: linear-gradient(155deg, var(--accent), var(--accent-2)); border-color: transparent; }
  .stat.accent .k { color: rgba(255,255,255,.78); } .stat.accent .v { color: #fff; }
  .chart-card { padding: 18px 20px 16px; }
  .chart-card .k { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  .chart-card .sub2 { font-size: 12px; color: var(--ink-muted); margin-bottom: 16px; }
  .bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-row .lbl { width: 92px; font-size: 12.5px; color: var(--ink-2); flex-shrink: 0; display: flex; align-items: center; gap: 6px; }
  .bar-track { display: block; flex: 1; height: 18px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
  /* `display: block` is load-bearing here: these are spans, and width and
     height are both ignored on an inline box. The track escaped it by being
     a flex item (which blockifies); the fill, one level deeper, stayed
     inline and drew nothing at all. */
  .bar-fill { display: block; height: 100%; border-radius: 5px; transition: width .4s ease; }
  .bar-row .val { width: 92px; text-align: right; font-size: 12.5px; color: var(--ink-2); flex-shrink: 0; font-variant-numeric: tabular-nums; }

  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
  .dot.ok { background: var(--good); } .dot.warn { background: var(--warn); } .dot.off { background: var(--ink-muted); }
  .panel-row { display: flex; align-items: center; gap: 9px; padding: 8px 0; font-size: 13px; }
  .panel-entry { border-bottom: 1px solid var(--border); }
  .panel-entry:last-child { border-bottom: none; }
  .state-label { font-size: 11.5px; color: var(--ink-muted); }
  /* Extra models sit under their provider, indented to the checkbox column so
     it reads as "these run on that key" rather than as five more providers. */
  .panel-models { padding: 0 0 8px 25px; }
  .panel-model { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
  .panel-model input[type=text] { flex: 1; min-width: 0; font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; padding: 5px 8px; border-radius: 7px; }
  .panel-add { font-size: 12px; padding-top: 3px; }
  .cat-note { font-size: 11.5px; color: var(--ink-muted); margin-left: 7px; }

  .banner { padding: 11px 14px; border-radius: 10px; font-size: 12.5px; margin-bottom: 14px; border: 1px solid transparent; line-height: 1.5; }
  .banner.warn { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 35%, var(--border)); color: var(--ink); }
  .banner.danger { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-color: color-mix(in srgb, var(--bad) 35%, var(--border)); color: var(--ink); }
  .banner.ok { background: color-mix(in srgb, var(--good) 12%, var(--surface)); border-color: color-mix(in srgb, var(--good) 35%, var(--border)); color: var(--ink); }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: 11px; letter-spacing: .02em; border: 1px solid var(--border); }
  .tag.CONSENSUS { background: color-mix(in srgb, var(--good) 16%, var(--surface)); color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, var(--border)); }
  .tag.MAJORITY_WITH_DISSENT, .tag.SPLIT_DECISION { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--border)); }
  .tag.INSUFFICIENT_EVIDENCE { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--border)); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
  th { color: var(--ink-muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: none; }

  .log { max-height: 300px; overflow-y: auto; font-family: "IBM Plex Mono", monospace; font-size: 11px;
    background: var(--code-bg); border-radius: 10px; padding: 8px; }
  .log div { padding: 3px 0; border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--surface-3);
    border-top-color: var(--accent); display: inline-block; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 5px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  .skeleton { background: var(--surface-2); border-radius: 6px; height: 1em; margin: 8px 0; }
  .field-error { color: var(--bad); font-size: 12px; margin-top: 6px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .filters select { width: auto; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
  fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
  legend { font-weight: 600; font-size: 12px; padding: 0 4px; }
</style>
</head>
<body>
<div class="topbar">
  <a class="brand" href="#/compare"><span class="mark"></span>Multiplex</a>
  <nav class="tabs" aria-label="Screens">
    <a class="tab-btn" href="#/compare" id="nav-compare">Compare</a>
    <a class="tab-btn" href="#/new" id="nav-new">Debate</a>
    <a class="tab-btn" href="#/flow" id="nav-flow">Flow</a>
    <a class="tab-btn" href="#/usage" id="nav-usage">Usage</a>
    <a class="tab-btn" href="#/history" id="nav-history">History</a>
    <a class="tab-btn" href="#/keys" id="nav-keys">Keys</a>
  </nav>
  <div class="spacer"></div>
  <div class="run-status" id="run-status"><span class="sdot"></span><span id="run-status-text">Ready</span></div>
</div>
<main id="app" role="main" aria-live="polite"></main>
<script>
(function () {
  "use strict";

  // ---- token: read once from the URL --open prints, kept in memory only.
  // Never localStorage -- U7's own "no localStorage beyond the active run
  // id" rule; the token is exactly the one thing that must not persist.
  var params = new URLSearchParams(location.search);
  var TOKEN = params.get("token") || "";

  // The last comparison's results, kept in memory so the Usage tab has
  // something real to chart. Deliberately not persisted: it is per-answer
  // model output, and this page stores nothing but a run id.
  var lastCompare = { prompt: "", rows: [] };

  function activeRunId() {
    try { return localStorage.getItem("arbiter_active_run_id") || ""; } catch (e) { return ""; }
  }
  function setActiveRunId(id) {
    try { localStorage.setItem("arbiter_active_run_id", id); } catch (e) { /* private mode etc: fine, URL still carries it */ }
  }

  function h(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) { return "$" + Number(n).toFixed(3); }
  // Three decimals is right for a run's budget but wrong for one cheap
  // answer: a real $0.00004 renders as "$0.000", which reads as free. Below
  // a tenth of a cent, show two significant figures instead.
  function fineMoney(n) {
    var v = Number(n);
    if (v >= 0.001 || v <= 0) return money(v);
    return "$" + v.toPrecision(2).replace(/0+$/, "").replace(/\.$/, "");
  }
  function pct(n) { return (Number(n) * 100).toFixed(0) + "%"; }

  // One colour and one line of description per provider, so a model looks
  // the same on its roster card, its response card and its usage bar. An
  // id this table does not know still renders -- in the neutral colour --
  // rather than disappearing, because the provider list comes from the
  // server and may outgrow this page.
  var META = {
    anthropic: { color: "var(--anthropic)", desc: "Balanced reasoning and writing" },
    openai:    { color: "var(--openai)",    desc: "Strong general reasoning" },
    gemini:    { color: "var(--gemini)",    desc: "Multimodal strength" },
    xai:       { color: "var(--xai)",       desc: "Real-time awareness" },
    deepseek:  { color: "var(--deepseek)",  desc: "Technical and coding focus" },
    openrouter:{ color: "var(--openrouter)", desc: "One key, many vendors — billed by OpenRouter" },
    groq:      { color: "var(--groq)",      desc: "Open-weight models, very fast" },
    mock:      { color: "var(--mock)",      desc: "Synthetic panel — no key, no network" },
  };
  function colorOf(id) { return (META[id] || {}).color || "var(--mock)"; }
  function descOf(id) { return (META[id] || {}).desc || "provider"; }

  var app = document.getElementById("app");

  function setScreen(html) {
    app.innerHTML = html;
    var heading = app.querySelector("h1");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
  }

  function setStatus(text, live) {
    var el = document.getElementById("run-status");
    var t = document.getElementById("run-status-text");
    if (t) t.textContent = text;
    if (el) el.classList.toggle("live", !!live);
  }

  // ---- fetch wrapper: every request carries the token; a 403 or a network
  // failure gets exactly one message, never a silent hang or a forever spinner.
  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ "X-Arbiter-Token": TOKEN }, opts.headers || {});
    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch(path, {
      method: opts.method || "GET",
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
    }).then(function (resp) {
      if (resp.status === 403) {
        var err = new Error("stale-page");
        err.stale = true;
        throw err;
      }
      return resp.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { /* non-JSON body */ }
        if (!resp.ok) {
          var e2 = new Error((data && data.error) || ("HTTP " + resp.status));
          e2.status = resp.status;
          e2.data = data;
          throw e2;
        }
        return data;
      });
    }).catch(function (e) {
      if (e.stale || e.status) throw e;
      var e3 = new Error("unreachable");
      e3.unreachable = true;
      throw e3;
    });
  }

  function errorBanner(e, onRetry) {
    if (e && e.stale) {
      return '<div class="banner danger" role="alert">This page is stale — reopen it from the terminal (the access token rotates every time <code>arbiter serve</code> starts).</div>';
    }
    if (e && e.unreachable) {
      return '<div class="banner danger" role="alert">Cannot reach the server. Check that <code>arbiter serve</code> is still running.'
        + (onRetry ? ' <button class="link" data-retry>Retry</button>' : "") + "</div>";
    }
    return '<div class="banner danger" role="alert">' + h((e && e.message) || "Something went wrong") + "</div>";
  }

  // =====================================================================
  // Router
  // =====================================================================
  // The comparison screen is the front door: it is the thing you can use
  // with one key and no setup, where a debate needs a panel and a budget.
  function route() {
    var hash = location.hash.replace(/^#/, "") || "/compare";
    var parts = hash.split("/").filter(Boolean);
    var tab = parts[0] || "compare";
    if (tab === "running" || tab === "result") tab = "new";
    updateNav(tab);
    if (parts[0] === "running" && parts[1]) return screenRunning(parts[1]);
    if (parts[0] === "result" && parts[1]) return screenResult(parts[1]);
    if (parts[0] === "new") return screenNew();
    if (parts[0] === "flow") return screenFlow();
    if (parts[0] === "usage") return screenUsage();
    if (parts[0] === "history") return screenHistory();
    if (parts[0] === "keys") return screenKeys();
    return screenCompare();
  }
  function updateNav(current) {
    ["compare", "new", "flow", "usage", "history", "keys"].forEach(function (name) {
      var el = document.getElementById("nav-" + name);
      if (!el) return;
      if (name === current) el.setAttribute("aria-current", "page");
      else el.removeAttribute("aria-current");
    });
  }
  window.addEventListener("hashchange", route);

  // A coloured roster card per provider (image 1): who is available, on
  // what model, and whether it can actually be called.
  function modelCardHtml(p) {
    var usable = !!p.usable;
    return '<div class="model-card' + (usable ? "" : " unusable") + '" style="background:' + colorOf(p.id) + '">'
      + '<div class="top"><span class="idot"></span><span class="nm">' + h(p.id) + "</span>"
      + (p.model_id ? '<span class="ver">' + h(p.model_id) + "</span>" : "") + "</div>"
      + '<div class="desc">' + h(usable ? descOf(p.id) : "no key configured") + "</div>"
      + "</div>";
  }

  // =====================================================================
  // Compare — the front door
  // =====================================================================
  // One prompt, every keyed provider, answers side by side. This is what the
  // standalone Node app in tools/multiplex/ used to do; it lives here now so
  // there is one binary, one UI and one launcher.
  //
  // Unlike a debate, a comparison is not stored and claims nothing about the
  // answers: it is "here is what each one said", which is why a provider
  // with no key is greyed out rather than refused (the debate panel refuses,
  // because its confidence figure depends on who actually answered).
  function screenCompare() {
    setStatus("Ready", false);
    setScreen('<h1>Compare</h1><div class="card panel"><div class="skeleton" style="width:50%"></div><div class="skeleton"></div></div>');

    api("/api/providers").then(function (data) {
      renderCompare((data.providers || []).filter(function (p) { return p.id !== "mock"; }));
    }).catch(function (e) {
      setScreen('<h1>Compare</h1>' + errorBanner(e, true));
      var retry = app.querySelector("[data-retry]");
      if (retry) retry.addEventListener("click", screenCompare);
    });
  }

  function renderCompare(providers) {
    var usable = providers.filter(function (p) { return p.usable; });
    setScreen(
      '<h1>Compare</h1>' +
      '<p class="sub">The same prompt, sent to every model you have a key for. Nothing is saved and nothing is judged — for a decision with reasoning behind it, run a <a href="#/new">debate</a>.</p>' +
      (usable.length === 0
        ? '<div class="banner warn" role="status">No provider keys are configured, so there is nothing to compare yet. <a href="#/keys">Add a key</a> — every model below will answer once one is set.</div>'
        : "") +
      '<div class="model-row">' + providers.map(modelCardHtml).join("") + "</div>" +
      '<div class="split">' +
      '<div class="stack">' +
      '<form id="compare-form" class="card panel" novalidate>' +
      '<div class="ptitle">Prompt</div>' +
      '<textarea id="compare-prompt" autofocus required placeholder="Explain the trade-off between a modular monolith and microservices for a team of six."></textarea>' +
      '<div id="compare-error"></div>' +
      '<button type="submit" class="btn-primary" id="compare-btn" style="margin-top:12px">Ask all models</button>' +
      "</form>" +
      '<div class="card panel">' +
      '<div class="ptitle">What this measures</div>' +
      '<p class="sub" style="margin:0">Tokens, cost and latency per answer — all three are facts the providers report. Judging the writing is yours to do; nothing here scores an answer.</p>' +
      "</div>" +
      "</div>" +
      '<div>' +
      '<div id="compare-results" class="resp-grid"></div>' +
      '<p id="compare-total" class="sub" style="margin-top:14px" aria-live="polite"></p>' +
      "</div>" +
      "</div>"
    );

    var results = document.getElementById("compare-results");
    var totalEl = document.getElementById("compare-total");
    var cards = {};
    var running = false;
    results.innerHTML = '<div class="card"><p class="empty-note">Ask a question above and the answers land here, one card per model.</p></div>';

    function cardFor(id) {
      if (!cards[id]) {
        var el = document.createElement("div");
        el.className = "resp-card";
        el.id = "resp-" + id;
        results.appendChild(el);
        cards[id] = el;
      }
      return cards[id];
    }

    function renderCard(id, state, opts) {
      opts = opts || {};
      var el = cardFor(id);
      el.className = "resp-card" + (state === "skipped" ? " is-skipped" : "") + (state === "error" ? " is-error" : "");
      var stageClass = state === "done" ? "ok" : state === "error" ? "err" : state === "running" ? "on" : "";
      var stage = state === "running"
        ? '<span class="stage-txt on"><span class="spinner" aria-hidden="true"></span>streaming</span>'
        : '<span class="stage-txt ' + stageClass + '">' + h(opts.label || state) + "</span>";
      var foot = "";
      if (state === "done") {
        foot = '<div class="rfoot">'
          + '<span class="rmeta">' + opts.total_tokens + " tok · " + opts.prompt_tokens + " in / " + opts.completion_tokens + " out</span>"
          // A price this build has no table for shows as "cost unknown", not
          // as $0.000 -- a zero would read as "this one was free".
          + '<span class="rmeta">' + (opts.cost_usd === null || opts.cost_usd === undefined ? "cost unknown" : fineMoney(opts.cost_usd))
          + " · " + (opts.elapsed_ms / 1000).toFixed(1) + "s</span>"
          + "</div>";
      }
      el.innerHTML =
        '<div class="rhead"><span class="nm"><span class="rdot" style="background:' + colorOf(id) + '"></span>' + h(id) + "</span>" + stage + "</div>"
        + '<div class="rbody"><pre class="answer">' + h(opts.text || "") + "</pre></div>"
        + foot;
    }

    document.getElementById("compare-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (running) return;
      var prompt = document.getElementById("compare-prompt").value;
      if (!prompt.trim()) {
        document.getElementById("compare-error").innerHTML = '<p class="field-error">The prompt must not be empty.</p>';
        return;
      }
      document.getElementById("compare-error").innerHTML = "";
      results.innerHTML = "";
      cards = {};
      totalEl.textContent = "";
      running = true;
      setStatus("Comparing…", true);
      lastCompare = { prompt: prompt.trim(), rows: [] };
      var btn = document.getElementById("compare-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Asking…';

      var spent = 0, priced = 0;
      function finish() {
        running = false;
        setStatus("Ready", false);
        btn.disabled = false;
        btn.textContent = "Ask all models";
        totalEl.textContent = priced === 0
          ? "No published price for any model that answered."
          : "Total, estimated from list prices: " + money(spent) + " across " + priced + " answer" + (priced === 1 ? "" : "s") + ". See the Usage tab for the breakdown.";
      }

      streamCompare(prompt, function (name, data) {
        if (name === "model-skipped") renderCard(data.model, "skipped", { label: "skipped", text: data.reason });
        else if (name === "model-start") renderCard(data.model, "running");
        else if (name === "model-done") {
          renderCard(data.model, "done", data);
          lastCompare.rows.push(data);
          if (data.cost_usd !== null && data.cost_usd !== undefined) { spent += data.cost_usd; priced += 1; }
        }
        else if (name === "model-error") renderCard(data.model, "error", { label: "failed", text: data.error });
        else if (name === "run-done") finish();
      }, function (err) {
        document.getElementById("compare-error").innerHTML = '<p class="field-error">' + h(err.message || String(err)) + "</p>";
        finish();
      });
    });
  }

  // `EventSource` cannot POST, and the prompt does not belong in a URL (it
  // would land in any proxy's access log), so the SSE frames are read off a
  // streamed `fetch` body by hand. The framing is the same one the run event
  // stream uses: `event:` and `data:` lines, blank line ends a frame.
  function streamCompare(prompt, onEvent, onError) {
    fetch("/api/compare", {
      method: "POST",
      headers: { "X-Arbiter-Token": TOKEN, "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: prompt }),
    }).then(function (resp) {
      if (!resp.ok) {
        return resp.text().then(function (text) {
          var data = null;
          try { data = JSON.parse(text); } catch (e) { /* non-JSON body */ }
          throw new Error((data && data.error) || ("HTTP " + resp.status));
        });
      }
      var reader = resp.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return;
          buffer += decoder.decode(chunk.value, { stream: true });
          var frames = buffer.split("\n\n");
          buffer = frames.pop();
          frames.forEach(function (frame) {
            var name = "message";
            var data = "";
            frame.split("\n").forEach(function (line) {
              if (line.indexOf("event:") === 0) name = line.slice(6).trim();
              else if (line.indexOf("data:") === 0) data += line.slice(5).trim();
            });
            if (!data) return;
            try { onEvent(name, JSON.parse(data)); } catch (e) { /* a frame we don't understand is skipped, not fatal */ }
          });
          return pump();
        });
      }
      return pump();
    }).catch(onError);
  }

  // =====================================================================
  // Debate — question, panel, budget
  // =====================================================================
  function screenNew() {
    setStatus("Ready", false);
    setScreen('<h1>Debate</h1><div class="card panel"><div class="skeleton" style="width:60%"></div><div class="skeleton"></div></div>');

    api("/api/providers").then(function (data) {
      var providers = data.providers || [];
      var usable = providers.filter(function (p) { return p.usable; });
      if (providers.length === 0) { location.hash = "#/keys"; return; }
      // Default selection: every real provider that has a key. `mock` is
      // only pre-selected when nothing real is available, because a panel
      // mixing synthetic answers with real ones is a debate whose result
      // means nothing -- and silently including it would be exactly the
      // "panel the operator never approved" that panel resolution refuses.
      var realUsable = usable.filter(function (p) { return p.id !== "mock"; });
      providers.forEach(function (p) {
        p.checked = p.usable && (realUsable.length > 0 ? p.id !== "mock" : true);
      });
      renderNewForm(providers, usable, data.estimates || {});
    }).catch(function (e) {
      setScreen('<h1>Debate</h1>' + errorBanner(e, true));
      var retry = app.querySelector("[data-retry]");
      if (retry) retry.addEventListener("click", screenNew);
    });
  }

  function panelRowHtml(p) {
    var dotClass = "off", label = "no key";
    if (p.state === "not_required" || p.state === "verified") { dotClass = "ok"; label = p.state === "verified" ? "ready" : "ready (no key needed)"; }
    else if (p.state === "present") { dotClass = "warn"; label = "key set, not checked"; }
    else if (p.state === "rejected") { dotClass = "warn"; label = "key rejected" + (p.status ? " · " + p.status : ""); }
    else if (p.state === "unreachable") { label = "provider unreachable"; }
    var action = "";
    if (p.state === "rejected" || p.state === "missing") action = '<a href="#/keys">' + (p.state === "rejected" ? "Fix" : "Add") + "</a>";
    else if (p.state === "unreachable") action = '<button class="link" type="button" data-recheck="' + h(p.id) + '">Re-check</button>';
    // Before P4 this box was `checked disabled` decoration: `mock` was the
    // only panel this build could run, so there was nothing to choose. It is
    // now the actual panel selection -- checked by default when the provider
    // is usable, disabled only when it has no key to run with.
    // `mock` is a fixed three-model synthetic roster behind one name, so
    // there is no second model to add to it; every real provider can seat as
    // many as its key will serve.
    var extras = p.usable && p.id !== "mock"
      ? '<div class="panel-models" data-models-for="' + h(p.id) + '">'
        + '<datalist id="models-' + h(p.id) + '"></datalist>'
        + '<div class="panel-add">'
        + '<button type="button" class="link" data-add-model="' + h(p.id) + '">+ another model</button>'
        + ' <span class="state-label">·</span> '
        + '<button type="button" class="link" data-free-models="' + h(p.id) + '">use free open-weight models</button>'
        + '<span class="cat-note" data-note-for="' + h(p.id) + '"></span>'
        + "</div>"
        + "</div>"
      : "";
    return '<li class="panel-entry">'
      + '<div class="panel-row">'
      + '<input type="checkbox" class="panel-pick" data-provider="' + h(p.id) + '"'
      + (p.checked ? " checked" : "") + (p.usable ? "" : " disabled")
      + ' aria-label="' + h(p.id) + '">'
      + '<span class="dot ' + dotClass + '" aria-hidden="true"></span>'
      + "<strong>" + h(p.id) + "</strong>"
      + '<span class="state-label">' + h(label) + "</span>"
      + '<span style="margin-left:auto">' + action + "</span>"
      + "</div>"
      + extras
      + "</li>";
  }

  function renderNewForm(providers, usable, estimates) {
    setScreen(
      '<h1>Debate</h1>' +
      '<p class="sub">Several models argue the question, challenge each other, and a judge scores what survives. Slower and dearer than <a href="#/compare">Compare</a> — it produces a decision with a record behind it.</p>' +
      '<div class="model-row">' + providers.map(modelCardHtml).join("") + "</div>" +
      '<div class="split">' +
      '<form id="new-run-form" class="card panel" novalidate>' +
      '<div class="ptitle">Question</div>' +
      '<textarea id="question" name="question" autofocus required placeholder="Should we adopt a modular monolith or microservices? Paste a paragraph, or a path to a file."></textarea>' +
      '<div class="row" style="margin-top:14px">' +
      '<div><label for="depth">Depth</label>' +
      '<select id="depth" name="depth">' +
      '<option value="standard">standard — 1 round</option>' +
      '<option value="deep">deep — up to 3 rounds</option>' +
      "</select></div>" +
      '<div><label for="budget">Budget cap</label>' +
      '<input type="number" id="budget" name="budget" min="0" step="0.01" value="2.00"></div>' +
      "</div>" +
      '<p id="estimate" class="sub" style="margin:14px 0 0" aria-live="polite"></p>' +
      '<div id="submit-error"></div>' +
      '<button type="submit" class="btn-primary" id="start-btn" style="margin-top:12px"' + (usable.length === 0 ? " disabled" : "") + ">Start debate</button>" +
      "</form>" +
      '<div class="stack">' +
      '<div class="card panel">' +
      '<div class="ptitle">Panel <span id="panel-count" class="state-label"></span></div>' +
      '<p class="sub" style="margin:0 0 10px">One line per model. A key can seat more than one — five models behind two keys is a bigger panel, not five independent sources.</p>' +
      '<div id="panel-warning"></div>' +
      '<ul style="list-style:none;padding:0;margin:0">' + providers.map(panelRowHtml).join("") + "</ul>" +
      '<p class="sub" style="margin:12px 0 0"><a href="#/keys">Manage keys</a></p>' +
      "</div>" +
      "</div>" +
      "</div>"
    );

    function selectedProviders() {
      var out = [];
      var boxes = document.querySelectorAll(".panel-pick");
      for (var i = 0; i < boxes.length; i++) {
        if (boxes[i].checked && !boxes[i].disabled) out.push(boxes[i].getAttribute("data-provider"));
      }
      return out;
    }

    // The model ids typed under one provider, blanks dropped. An empty row is
    // a row the operator is still filling in, not a model — it must not reach
    // the spec, where `provider:` would resolve to the default model and seat
    // the same model twice.
    function extraModelsFor(id) {
      var out = [];
      var block = document.querySelector('[data-models-for="' + id.replace(/"/g, '') + '"]');
      if (!block) return out;
      Array.prototype.forEach.call(block.querySelectorAll("input[type=text]"), function (input) {
        var v = input.value.trim();
        if (v) out.push(v);
      });
      return out;
    }

    // The `--panel` spec, exactly as the CLI takes it: `provider:model` for
    // every line the operator can see, and a bare provider (its default model)
    // only when a ticked provider has no lines at all. A provider listed
    // several times is several models on one adapter, which is what makes a
    // five-model panel reachable from one key.
    function selectedPanelSpec() {
      var out = [];
      selectedProviders().forEach(function (id) {
        var models = extraModelsFor(id);
        if (models.length === 0) { out.push(id); return; }
        models.forEach(function (model) { out.push(id + ":" + model); });
      });
      return out;
    }

    // How many models one ticked provider puts on the panel. `mock` is a
    // three-model synthetic roster behind one name, so the server sends its
    // own contribution; a real provider is one model per line, or one (its
    // default) when it has no lines.
    function modelsFrom(id) {
      var p = null;
      providers.forEach(function (row) { if (row.id === id) p = row; });
      if (p && p.id === "mock") return p.models || 1;
      return Math.max(1, extraModelsFor(id).length);
    }

    // Summing integers is not "computing an estimate" (U7) -- every figure
    // shown still comes from the table the server precomputed.
    function selectedModelCount() {
      return selectedProviders().reduce(function (n, id) { return n + modelsFrom(id); }, 0);
    }

    // Two different facts, and conflating them is how a panel of five models
    // behind one key comes to read as five-way cross-checking. The count says
    // how big the panel is; the warning says how many *independent* sources
    // it has, because §6.2's independence term is about the providers that
    // actually ran, not the roster's length.
    function updateWarning() {
      var picked = selectedProviders().length;
      var models = selectedModelCount();
      var count = document.getElementById("panel-count");
      if (count) count.textContent = models === 0 ? "" :
        "· " + models + " model" + (models === 1 ? "" : "s") + " · " + picked + " provider" + (picked === 1 ? "" : "s");
      var el = document.getElementById("panel-warning");
      if (!el) return;
      if (models === 0) {
        el.innerHTML = '<div class="banner warn" role="status">No models selected — pick at least one. <a href="#/keys">Add more keys</a>.</div>';
        return;
      }
      if (picked >= 3) { el.innerHTML = ""; return; }
      el.innerHTML = '<div class="banner warn" role="status">' +
        models + " model" + (models === 1 ? "" : "s") + " from only " + picked + " provider" + (picked === 1 ? "" : "s") +
        " — correlated failures between models from the same source will not be caught by cross-checking, however many of them answer." +
        ' <a href="#/keys">Add more keys</a>.</div>';
    }

    // One more model line under a provider. Added empty and focused: the
    // operator types the vendor's own model id (`deepseek/deepseek-chat`),
    // and this build does not know what any given key is entitled to, so
    // there is no list to offer instead.
    function addModelRow(id, value) {
      var block = document.querySelector('[data-models-for="' + id.replace(/"/g, '') + '"]');
      if (!block) return null;
      var row = document.createElement("div");
      row.className = "panel-model";
      row.innerHTML = '<input type="text" spellcheck="false" autocapitalize="off" autocomplete="off"'
        + ' list="models-' + h(id) + '"'
        + ' aria-label="model for ' + h(id) + '" placeholder="model id, e.g. ' + h(exampleModelFor(id)) + '">'
        + '<button type="button" class="link" data-drop-model="1" aria-label="remove this model">remove</button>';
      block.insertBefore(row, block.lastElementChild);
      var input = row.querySelector("input");
      if (value) input.value = value;
      input.addEventListener("input", refresh);
      // Autocomplete costs one free listing call, made the first time someone
      // means to type here rather than on page load for providers nobody
      // touches.
      input.addEventListener("focus", function () { loadCatalogue(id).catch(function () {}); });
      row.querySelector("[data-drop-model]").addEventListener("click", function () {
        row.parentNode.removeChild(row);
        refresh();
      });
      return input;
    }

    // A plausible id for the provider, shown as placeholder text only. Wrong
    // for most keys and deliberately not authoritative -- it is there so the
    // field's shape is obvious, not to suggest this model is available.
    function exampleModelFor(id) {
      if (id === "openrouter") return "meta-llama/llama-3.3-70b-instruct";
      if (id === "groq") return "llama-3.1-8b-instant";
      if (id === "openai") return "gpt-4o-mini";
      if (id === "anthropic") return "claude-haiku-4-5";
      if (id === "gemini") return "gemini-3.6-flash-lite";
      if (id === "deepseek") return "deepseek-reasoner";
      return "model-id";
    }

    function updateEstimate() {
      var depth = document.getElementById("depth").value;
      // A lookup, never a calculation: the server precomputed one estimate
      // per possible panel size, so ticking a box changes which row is read
      // and the page still computes no number of its own (U7). An older
      // response with no table falls back to the whole-roster figure.
      var table = (estimates.per_model_count || {})[depth];
      var n = selectedModelCount();
      // A panel past the end of the table is quoted from its last row and
      // said to be a floor, never from the whole-roster figure: a bigger
      // panel costs more, and falling back to a smaller number would understate
      // it in exactly the case the operator most needs it not to.
      var beyond = !!(table && table.length && n >= table.length);
      var est = table ? (beyond ? table[table.length - 1] : table[n]) : estimates[depth];
      var el = document.getElementById("estimate");
      if (!est) { el.textContent = ""; return; }
      el.textContent = "Estimate: " + (beyond ? "at least " : "up to ") + money(est.cost) + " · " + (beyond ? "≥" : "") + est.calls + " calls · up to " + est.wall_clock_secs + "s · " + n + " model" + (n === 1 ? "" : "s") + " (falls as models become unusable)";
    }
    function refresh() { updateEstimate(); updateWarning(); }
    document.getElementById("depth").addEventListener("change", updateEstimate);
    Array.prototype.forEach.call(document.querySelectorAll(".panel-pick"), function (box) {
      box.addEventListener("change", refresh);
    });
    function tick(id) {
      var box = document.querySelector('.panel-pick[data-provider="' + id + '"]');
      if (box && !box.disabled) box.checked = true;
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-add-model]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-add-model");
        var input = addModelRow(id);
        // A blank line is not a model yet, so the count does not move -- but
        // tick the provider it belongs to, since adding a model to a panel you
        // are not running is never what was meant.
        tick(id);
        refresh();
        if (input) input.focus();
      });
    });

    // The catalogue, once per provider per page: the vendor's own model list,
    // read with the operator's own key. Cached because it is the same answer
    // for every button press and this screen should not re-ask a vendor for a
    // list it already has.
    var catalogues = {};
    function loadCatalogue(id) {
      if (catalogues[id]) return Promise.resolve(catalogues[id]);
      return api("/api/providers/" + encodeURIComponent(id) + "/models").then(function (data) {
        catalogues[id] = data;
        // Autocomplete for the lines typed by hand, so a model id can be
        // picked rather than remembered -- a typo here is a 404 from the
        // vendor part-way through a paid run.
        var list = document.getElementById("models-" + id);
        if (list) {
          list.innerHTML = (data.models || []).map(function (m) {
            var note = m.free === true ? " · free" : "";
            return '<option value="' + h(m.id) + '">' + h(m.id + note) + "</option>";
          }).join("");
        }
        return data;
      });
    }

    Array.prototype.forEach.call(document.querySelectorAll("[data-free-models]"), function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-free-models");
        var note = document.querySelector('[data-note-for="' + id + '"]');
        var label = btn.textContent;
        btn.disabled = true;
        btn.textContent = "asking " + id + "…";
        if (note) note.textContent = "";
        loadCatalogue(id).then(function (data) {
          btn.disabled = false;
          btn.textContent = label;
          var free = data.suggested || [];
          if (free.length === 0) {
            if (note) note.textContent = "· " + id + " lists no free open-weight models on this key";
            return;
          }
          tick(id);
          // Fill this provider up to whatever the rest of the panel is short
          // of the target, so the button reaches five models rather than
          // adding five more on top of what is already there.
          var target = data.suggested_target || 5;
          var others = selectedProviders().reduce(function (n, other) {
            return other === id ? n : n + modelsFrom(other);
          }, 0);
          var want = Math.max(1, Math.min(free.length, target - others));
          // Replaces this provider's lines rather than appending to them: the
          // line already there is its default model, which is a *billed* one,
          // and leaving it in place would quietly put a paid model on a panel
          // the operator just asked to make free.
          var block = document.querySelector('[data-models-for="' + id + '"]');
          Array.prototype.forEach.call(block.querySelectorAll(".panel-model"), function (row) {
            row.parentNode.removeChild(row);
          });
          free.slice(0, want).forEach(function (model) { addModelRow(id, model); });
          if (note) {
            note.textContent = "· " + want + " free open-weight model" + (want === 1 ? "" : "s")
              + ", one per family — licences differ, check the vendor's";
          }
          refresh();
        }).catch(function (e) {
          btn.disabled = false;
          btn.textContent = label;
          if (note) note.textContent = "· " + (e && e.message ? e.message : "could not read the model list");
        });
      });
    });

    // Every usable provider starts with its default model on a visible line,
    // not as an invisible fallback. `--panel openrouter` and
    // `--panel openrouter:<its default>` are the same run, but only one of
    // them can be read off the screen and swapped for something free.
    providers.forEach(function (p) {
      if (p.usable && p.id !== "mock" && p.default_model) addModelRow(p.id, p.default_model);
    });
    refresh();

    var form = document.getElementById("new-run-form");
    var submitting = false;
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      if (submitting) return; // double-submit impossible
      var question = document.getElementById("question").value;
      if (!question.trim()) {
        document.getElementById("submit-error").innerHTML = '<p class="field-error">The question must not be empty.</p>';
        return;
      }
      var panel = selectedPanelSpec();
      if (panel.length === 0) {
        document.getElementById("submit-error").innerHTML = '<p class="field-error">Pick at least one model for the panel.</p>';
        return;
      }
      submitting = true;
      var btn = document.getElementById("start-btn");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Starting…';
      document.getElementById("submit-error").innerHTML = "";
      api("/api/runs", {
        method: "POST",
        body: {
          question: question,
          depth: document.getElementById("depth").value,
          budget: parseFloat(document.getElementById("budget").value) || undefined,
          panel: panel.join(","),
        },
      }).then(function (data) {
        setActiveRunId(data.run_id);
        location.hash = "#/running/" + encodeURIComponent(data.run_id);
      }).catch(function (e) {
        submitting = false;
        btn.disabled = usable.length === 0;
        btn.textContent = "Start debate";
        document.getElementById("submit-error").innerHTML =
          '<p class="field-error">' + h((e.data && e.data.error) || e.message) + "</p>" +
          '<p class="sub">Your question is still here — nothing was lost.</p>';
      });
    });
  }

  // =====================================================================
  // Running — live stages
  // =====================================================================
  // ARCHITECTURE §5's own 15-named-stage pipeline (init, panel.resolve,
  // ... build.*); this build never implements panel.resolve or build.*
  // (D42/scope notes throughout), so the visible counter only ever
  // reaches step 14 here -- kept at "of 15" to match the plan's own
  // literal wording (IMPLEMENTATION_PLAN.md U3) rather than inventing a
  // different total (PLAN_DEVIATIONS.md D49).
  var STAGE_ORDER = [
    "init", "panel.resolve", "positions.generate", "claims.extract", "claims.normalize",
    "options.cluster", "relations.analyze", "disputes.rank", "challenge.plan", "challenge.run",
    "rebuttal.run", "controller.decide", "judge.evaluate", "decision.synthesize", "build.*",
  ];
  // Shortened for the stepper only: the full dotted name does not fit under a
  // 24px node, and each node's `title` carries the real one. Spelled out
  // rather than derived by trimming at the dot -- that rule labelled both
  // `challenge.run` and `rebuttal.run` "run", and `build.*` just "*".
  var STAGE_LABEL = {
    "init": "init", "panel.resolve": "panel", "positions.generate": "positions",
    "claims.extract": "claims", "claims.normalize": "normalize", "options.cluster": "options",
    "relations.analyze": "relations", "disputes.rank": "disputes", "challenge.plan": "plan",
    "challenge.run": "challenge", "rebuttal.run": "rebuttal", "controller.decide": "controller",
    "judge.evaluate": "judge", "decision.synthesize": "decision", "build.*": "build",
  };
  function shortStage(name) { return STAGE_LABEL[name] || name; }

  function stepperHtml(reachedIndex, running) {
    return '<div class="stepper">' + STAGE_ORDER.map(function (name, i) {
      var cls = i < reachedIndex ? "done" : (i === reachedIndex ? (running ? "active" : "done") : "pending");
      return '<div class="step ' + cls + '" title="' + h(name) + '">'
        + '<span class="line"></span>'
        + '<span class="dot2">' + (i < reachedIndex ? "✓" : String(i + 1)) + "</span>"
        + '<span class="lbl2">' + h(shortStage(name)) + "</span>"
        + "</div>";
    }).join("") + "</div>";
  }

  function screenRunning(runId) {
    setActiveRunId(runId);
    setStatus("Running", true);
    var startedAt = Date.now();
    var events = [];
    var lastStage = "init";
    var round = 1;
    var source = null;
    var elapsedTimer = null;
    var paused = false;

    setScreen(
      '<h1>Running</h1>' +
      '<p class="sub">Run <code>' + h(runId) + "</code></p>" +
      '<div class="banner warn">Closing this page does not stop the run.</div>' +
      '<div id="conn-banner"></div>' +
      '<div class="card flow-wrap" id="run-stepper">' + stepperHtml(0, true) + "</div>" +
      '<div class="stat-row section-gap">' +
      '<div class="card stat accent"><div class="k">Stage</div><div class="v" id="stage-line" style="font-size:16px">Connecting…</div></div>' +
      '<div class="card stat"><div class="k">Progress</div><div class="v" id="progress-line">0<span class="unit">%</span></div></div>' +
      '<div class="card stat"><div class="k">Claims</div><div class="v" id="claims-line">0</div></div>' +
      '<div class="card stat"><div class="k">Elapsed</div><div class="v" id="elapsed-line">0<span class="unit">s</span></div></div>' +
      "</div>" +
      '<p><button type="button" class="ghost" id="stop-btn">Stop watching</button></p>' +
      '<div class="label section-gap">Event log — newest first</div>' +
      '<div class="log" id="event-log" tabindex="0" aria-label="Event log, newest first"></div>'
    );

    elapsedTimer = setInterval(function () {
      var el = document.getElementById("elapsed-line");
      if (el) el.innerHTML = Math.round((Date.now() - startedAt) / 1000) + '<span class="unit">s</span>';
    }, 1000);

    var logEl = document.getElementById("event-log");
    logEl.addEventListener("mouseenter", function () { paused = true; });
    logEl.addEventListener("mouseleave", function () { paused = false; renderLog(); });

    function renderLog() {
      logEl.innerHTML = events.slice().reverse().map(function (e) {
        return "<div>" + h(e.timestamp) + " · " + h(e.event_type) + " · " + h(JSON.stringify(e.payload)) + "</div>";
      }).join("");
      if (!paused) logEl.scrollTop = 0;
    }

    function stageIndex(name) {
      var i = STAGE_ORDER.indexOf(name);
      return i === -1 ? 0 : i;
    }

    function applyEvent(e) {
      events.push(e);
      // `EventType`'s own wire form is SCREAMING_SNAKE_CASE
      // (`arbiter-kernel/src/event.rs`'s `#[serde(rename_all = ...)]`) --
      // matched literally here, not guessed at.
      if (e.event_type === "STAGE_STARTED" || e.event_type === "STAGE_COMPLETED") {
        lastStage = e.stage;
      }
      if (e.stage === "challenge.plan" && e.event_type === "STAGE_STARTED") round += 1;
      var idx = stageIndex(lastStage);
      var stepper = document.getElementById("run-stepper");
      if (stepper) stepper.innerHTML = stepperHtml(idx, true);
      var stageLine = document.getElementById("stage-line");
      if (stageLine) stageLine.textContent = lastStage;
      var progressLine = document.getElementById("progress-line");
      if (progressLine) progressLine.innerHTML = Math.round(((idx + 1) / STAGE_ORDER.length) * 100) + '<span class="unit">% · round ' + round + " of 3 · step " + (idx + 1) + " of " + STAGE_ORDER.length + "</span>";
      var claimsLine = document.getElementById("claims-line");
      if (claimsLine && e.payload && typeof e.payload.claims === "number") claimsLine.textContent = String(e.payload.claims);

      if (e.event_type === "CALL_ORPHANED") {
        var banner = document.getElementById("conn-banner");
        if (banner && banner.innerHTML.indexOf("ORPHANED") === -1) {
          banner.innerHTML += '<div class="banner warn" role="alert">A provider call went ORPHANED — its status will be reconciled, surfaced here rather than waiting for the result screen.</div>';
        }
      }
      // A stage that failed outright is the most important thing on this
      // screen: without it a run that died of a bad key just stops moving.
      if (e.event_type === "STAGE_FAILED") {
        var b2 = document.getElementById("conn-banner");
        if (b2) b2.innerHTML += '<div class="banner danger" role="alert"><strong>' + h(e.stage) + ' failed.</strong> ' + h(JSON.stringify(e.payload)) + "</div>";
      }
      if (e.event_type === "RUN_COMPLETED") {
        clearInterval(elapsedTimer);
        location.hash = "#/result/" + encodeURIComponent(runId);
      }
      if (e.event_type === "RUN_FAILED") {
        clearInterval(elapsedTimer);
        setStatus("Failed", false);
        document.getElementById("conn-banner").innerHTML +=
          '<div class="banner danger" role="alert">Run failed: ' + h((e.payload && e.payload.error) || "unknown error") +
          '. What was kept is still viewable. <a href="#/result/' + encodeURIComponent(runId) + '">View</a></div>';
      }
      renderLog();
    }

    // First, confirm the run isn't already finished (a refresh/direct link
    // to an already-completed or unknown run must not show a frozen stream).
    api("/api/runs/" + encodeURIComponent(runId)).then(function (data) {
      if (data.status === "complete") { location.hash = "#/result/" + encodeURIComponent(runId); return; }
      if (data.status === "failed") {
        setStatus("Failed", false);
        document.getElementById("conn-banner").innerHTML = '<div class="banner danger" role="alert">This run failed. <a href="#/result/' + encodeURIComponent(runId) + '">View what was kept</a></div>';
        return;
      }
      connect();
    }).catch(function (e) {
      if (e.status === 404) {
        setScreen('<h1>Not found</h1><p class="sub">No run with id <code>' + h(runId) + "</code> is known to this server.</p>");
        return;
      }
      document.getElementById("conn-banner").innerHTML = errorBanner(e);
    });

    function connect() {
      var url = "/api/runs/" + encodeURIComponent(runId) + "/events?token=" + encodeURIComponent(TOKEN);
      source = new EventSource(url);
      document.getElementById("stage-line").textContent = "Connecting…";
      source.onopen = function () { document.getElementById("conn-banner").innerHTML = ""; };
      source.onmessage = function (msg) {
        try { applyEvent(JSON.parse(msg.data)); } catch (e) { /* skip a malformed line rather than crash the stream */ }
      };
      source.onerror = function () {
        document.getElementById("conn-banner").innerHTML = '<div class="banner warn" role="alert">Connection lost — reconnecting…</div>';
      };
    }

    document.getElementById("stop-btn").addEventListener("click", function () {
      if (source) source.close();
      if (elapsedTimer) clearInterval(elapsedTimer);
      setStatus("Ready", false);
      location.hash = "#/history";
    });
  }

  // =====================================================================
  // Result
  // =====================================================================
  // `ClaimStanding`'s own wire form is lowercase `snake_case`
  // (`arbiter-core/src/claim.rs`'s `#[serde(rename_all = "snake_case")]`):
  // "agreed" / "disputed" / "unresolved" / "defeated".
  function claimPill(standing) {
    return '<span class="tag ' + (standing === "agreed" ? "CONSENSUS" : standing === "defeated" ? "INSUFFICIENT_EVIDENCE" : "MAJORITY_WITH_DISSENT") + '">' + h(standing) + "</span>";
  }

  function screenResult(runId) {
    setActiveRunId(runId);
    setStatus("Ready", false);
    setScreen('<h1>Result</h1><div class="card panel"><div class="skeleton" style="width:50%"></div><div class="skeleton"></div></div>');

    api("/api/runs/" + encodeURIComponent(runId)).then(function (data) {
      if (data.status === "running") { location.hash = "#/running/" + encodeURIComponent(runId); return; }
      if (data.status === "failed") {
        setScreen('<h1>Result</h1><div class="banner danger" role="alert">This run failed before reaching a decision. Nothing further to show.</div>');
        return;
      }
      renderResult(runId, data);
    }).catch(function (e) {
      if (e.status === 404) { setScreen('<h1>Not found</h1><p class="sub">No run with id <code>' + h(runId) + "</code> is known to this server.</p>"); return; }
      setScreen('<h1>Result</h1>' + errorBanner(e));
    });
  }

  function renderResult(runId, data) {
    var explain = data.explain;
    var integrity = data.integrity || {};
    var isConsensus = data.outcome === "Consensus";
    var outcomeSlug = { Consensus: "CONSENSUS", MajorityWithDissent: "MAJORITY_WITH_DISSENT", SplitDecision: "SPLIT_DECISION", InsufficientEvidence: "INSUFFICIENT_EVIDENCE" }[data.outcome] || h(data.outcome);

    var banners = "";
    if (integrity.completeness && integrity.completeness.status === "truncated") {
      banners += '<div class="banner warn" role="alert">This decision was synthesised from the evidence gathered before the budget ran out, and is marked truncated' + (integrity.completeness.reason ? " (" + h(integrity.completeness.reason) + ")" : "") + ".</div>";
    }
    if (integrity.fixpoint_converged === false) {
      banners += '<div class="banner warn" role="alert">The argument graph did not converge within the iteration cap — the 0.05 convergence penalty below reflects this.</div>';
    }
    if (integrity.chain_verified === false) {
      banners += '<div class="banner danger" role="alert"><strong>Chain break detected.</strong> This run\'s event log could not be verified and its record may be incomplete or tampered with.</div>';
    }

    // "MAJORITY_WITH_DISSENT means something survived. A layout that hides
    // it lies." (U4) -- every non-CONSENSUS outcome gets this banner, not
    // only the ones with a disputed claim to name: a SplitDecision can
    // come purely from fragmented option shares with every claim already
    // Agreed (`defeat_chains` genuinely empty in that case), and that is
    // exactly as much "something survived" as a live dissenting claim is.
    var liveObjection = "";
    if (!isConsensus && explain.defeat_chains && explain.defeat_chains.length) {
      var top = explain.defeat_chains[0];
      liveObjection = '<div class="banner warn" role="alert"><strong>Live objection:</strong> claim <code>' + h(top.claim_id) + '</code> (standing ' + Number(top.standing).toFixed(2) + ") remains unresolved.</div>";
    } else if (!isConsensus) {
      var ranked = explain.options.slice().sort(function (a, b) { return b.share - a.share; });
      var margin = ranked.length > 1 ? ranked[0].share - ranked[1].share : 1;
      liveObjection = '<div class="banner warn" role="alert"><strong>Live objection:</strong> no single option has a clear majority — ' +
        h(ranked[0] ? ranked[0].label : "the leading option") + " leads by only " + pct(margin) + ", not a settled win.</div>";
    }

    var optionsRows = explain.options.map(function (o) {
      var below = o.share < 0.20;
      return "<tr><td>" + h(o.label) + (data.recommendation && data.recommendation.option_id === o.id ? ' <strong>(winner)</strong>' : "") + "</td><td>" + pct(o.share) + "</td><td>" + o.supported_by.length + "</td><td>" + o.opposed_by.length + "</td><td>" + (below ? '<span class="tag SPLIT_DECISION">below floor</span>' : "") + "</td></tr>";
    }).join("");

    var dims = explain.confidence.dimensions.map(function (d) {
      return "<tr><td>" + h(d.name) + "</td><td>" + Number(d.value).toFixed(2) + "</td><td>" + Number(d.weight).toFixed(2) + "</td><td>" + (d.contribution >= 0 ? "+" : "") + Number(d.contribution).toFixed(4) + "</td></tr>";
    }).join("");
    var pens = explain.confidence.penalties.map(function (p) {
      return "<tr><td>" + h(p.name) + (p.note ? ' <span class="muted">(' + h(p.note) + ")</span>" : "") + "</td><td>" + Number(p.contribution).toFixed(4) + "</td></tr>";
    }).join("");

    var claimsAll = data.claims || [];
    var triggers = (explain.change_triggers || []).map(function (t) {
      return "<li><code>" + h(t.claim_id) + "</code>: " + h(t.direction) + " → " + h(t.new_winner || "(none)") + "</li>";
    }).join("");

    setScreen(
      '<h1>Result</h1>' + banners + liveObjection +
      '<div class="card panel">' +
      '<span class="tag ' + outcomeSlug + '">' + outcomeSlug.replace(/_/g, " ") + "</span>" +
      '<h2 style="margin:10px 0 6px">' + (data.recommendation ? h(data.recommendation.label) : "No recommendation") + "</h2>" +
      '<p class="sub" style="margin:0">Confidence ' + Number(explain.confidence.total).toFixed(2) + " · " + claimsAll.length + " claims · policy <code>" + h(data.policy_version) + "</code></p>" +
      "</div>" +

      '<div class="label section-gap">Options</div>' +
      '<div class="card panel"><table><thead><tr><th>Option</th><th>Share</th><th>Supports</th><th>Opposes</th><th></th></tr></thead><tbody>' + optionsRows + "</tbody></table></div>" +

      '<div class="label section-gap">Confidence breakdown</div>' +
      '<div class="card panel">' +
      '<table id="dimensions-table"><thead><tr><th>Dimension</th><th>Value</th><th>Weight</th><th>Contribution</th></tr></thead><tbody>' + dims + "</tbody></table>" +
      '<table id="penalties-table" style="margin-top:10px"><thead><tr><th>Penalty</th><th>Contribution</th></tr></thead><tbody>' + pens + "</tbody></table>" +
      '<p class="sub" style="margin:10px 0 0">Total: <strong>' + Number(explain.confidence.total).toFixed(4) + "</strong> (base " + Number(explain.confidence.base).toFixed(4) + ")</p>" +
      "</div>" +

      '<div class="label section-gap">Claims</div>' +
      '<div class="card panel">' +
      '<div class="filters">' +
      '<label for="claim-filter" class="visually-hidden">Filter claims</label>' +
      '<select id="claim-filter"><option value="">Show all</option><option value="disputed">Disputed</option><option value="unresolved">Unresolved</option></select>' +
      "</div>" +
      '<table id="claims-table"><thead><tr><th>Claim</th><th>Kind</th><th>Standing</th></tr></thead><tbody></tbody></table>' +
      "</div>" +

      (triggers ? '<div class="label section-gap">Change triggers</div><div class="card panel"><ul>' + triggers + "</ul></div>" : "") +

      '<div class="label section-gap">Run integrity</div>' +
      '<div class="card panel"><ul style="margin:0;padding-left:18px">' +
      "<li>Chain: " + (integrity.chain_verified ? '<span class="dot ok" aria-hidden="true"></span> verified' : '<span class="dot warn" aria-hidden="true"></span> NOT verified') + "</li>" +
      "<li>Fixpoint: " + (integrity.fixpoint_converged ? '<span class="dot ok" aria-hidden="true"></span> converged' : '<span class="dot warn" aria-hidden="true"></span> not converged') + "</li>" +
      "<li>Completeness: " + h((integrity.completeness && integrity.completeness.status) || "unknown") + "</li>" +
      (integrity.orphaned_cost ? "<li>Orphaned spend: " + money(integrity.orphaned_cost) + "</li>" : "") +
      "</ul></div>" +

      '<div class="card panel section-gap" id="accept-card">' +
      '<div class="ptitle">Accept</div>' +
      '<div id="accept-area"></div>' +
      "</div>" +

      '<p><button type="button" class="ghost" id="export-json">Export JSON</button> <button type="button" class="ghost" id="export-md">Export Markdown</button></p>'
    );

    function renderClaims(filter) {
      var tbody = document.querySelector("#claims-table tbody");
      var rows = claimsAll.filter(function (c) { return !filter || c.standing === filter; });
      tbody.innerHTML = rows.map(function (c) {
        return "<tr><td>" + h(c.text) + "</td><td>" + h(c.kind) + "</td><td>" + claimPill(c.standing) + "</td></tr>";
      }).join("") || '<tr><td colspan="3" class="muted">(no claims match)</td></tr>';
    }
    document.getElementById("claim-filter").addEventListener("change", function (e) { renderClaims(e.target.value); });
    renderClaims("");

    document.getElementById("export-json").addEventListener("click", function () { downloadFile(runId + ".json", JSON.stringify(data, null, 2), "application/json"); });
    document.getElementById("export-md").addEventListener("click", function () {
      var md = "# Decision — " + runId + "\n\n" +
        "Outcome: " + outcomeSlug + "\n\n" +
        "Recommendation: " + (data.recommendation ? data.recommendation.label : "none") + "\n\n" +
        "Confidence: " + Number(explain.confidence.total).toFixed(4) + "\n";
      downloadFile(runId + ".md", md, "text/markdown");
    });

    renderAcceptArea(runId, data);
  }

  function downloadFile(name, content, type) {
    var blob = new Blob([content], { type: type });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function renderAcceptArea(runId, data) {
    var area = document.getElementById("accept-area");
    area.innerHTML =
      '<div id="override-rows"></div>' +
      '<button type="button" class="link" id="add-override">+ Add override</button><br><br>' +
      '<button type="button" class="btn-primary" id="accept-btn">Accept</button>' +
      '<div id="accept-result"></div>';

    var rows = [];
    function renderOverrideRows() {
      document.getElementById("override-rows").innerHTML = rows.map(function (_, i) {
        return "<fieldset><legend>Override " + (i + 1) + "</legend>" +
          '<label for="ov-path-' + i + '">Field path</label><input id="ov-path-' + i + '" data-idx="' + i + '" data-k="path">' +
          '<label for="ov-to-' + i + '" style="margin-top:8px">New value</label><input id="ov-to-' + i + '" data-idx="' + i + '" data-k="to">' +
          '<label for="ov-reason-' + i + '" style="margin-top:8px">Reason (required)</label><input id="ov-reason-' + i + '" data-idx="' + i + '" data-k="reason" required>' +
          "</fieldset>";
      }).join("");
    }
    document.getElementById("add-override").addEventListener("click", function () { rows.push({}); renderOverrideRows(); });

    document.getElementById("accept-btn").addEventListener("click", function () {
      var overrides = [];
      var missingReason = false;
      document.querySelectorAll("#override-rows fieldset").forEach(function (fs) {
        var path = fs.querySelector('[data-k="path"]').value;
        var to = fs.querySelector('[data-k="to"]').value;
        var reason = fs.querySelector('[data-k="reason"]').value;
        if (!path && !to && !reason) return;
        if (!reason.trim()) missingReason = true;
        overrides.push({ path: path, to: to, reason: reason });
      });
      var resultEl = document.getElementById("accept-result");
      if (missingReason) {
        resultEl.innerHTML = '<p class="field-error">Every override needs a reason before it can be accepted.</p>';
        return;
      }
      api("/api/runs/" + encodeURIComponent(runId) + "/accept", { method: "POST", body: { overrides: overrides } })
        .then(function (acc) {
          document.getElementById("accept-card").innerHTML =
            '<div class="ptitle">Accepted</div><p class="sub" style="margin:0">By ' + h(acc.accepted_by) + " at " + h(acc.accepted_at) + "</p>";
        })
        .catch(function (e) { resultEl.innerHTML = errorBanner(e); });
    });
  }

  // =====================================================================
  // Flow — where a debate got to, stage by stage
  // =====================================================================
  // The stepper on the Running screen shows the run you are watching now.
  // This tab answers the same question about a run you have already
  // started, by replaying its stored events rather than streaming: the
  // event log is the record, so a finished run explains itself just as
  // well as a live one.
  function screenFlow() {
    setStatus("Ready", false);
    setScreen('<h1>Flow</h1><div class="card panel"><div class="skeleton"></div></div>');
    var runId = activeRunId();
    (runId
      ? Promise.resolve(runId)
      : api("/api/runs").then(function (rows) {
          return rows && rows.length ? rows[0].run_id : "";
        }).catch(function () { return ""; })
    ).then(function (id) {
      if (!id) {
        setScreen(
          '<h1>Flow</h1>' +
          '<p class="sub">The pipeline a debate walks, stage by stage. Start one and this fills in.</p>' +
          '<div class="card flow-wrap">' + stepperHtml(-1, false) + "</div>" +
          '<div class="card panel section-gap"><p class="empty-note">No debates yet. <a href="#/new">Start one</a> and its stages appear here.</p></div>'
        );
        return;
      }
      showFlow(id);
    });
  }

  function showFlow(runId) {
    api("/api/runs/" + encodeURIComponent(runId)).then(function (data) {
      if (data.status === "running") { location.hash = "#/running/" + encodeURIComponent(runId); return; }
      renderFlow(runId, data);
    }).catch(function (e) {
      if (e.status === 404) {
        setScreen('<h1>Flow</h1><div class="card panel"><p class="empty-note">That run is no longer in the store. <a href="#/history">Pick another</a>.</p></div>');
        return;
      }
      setScreen('<h1>Flow</h1>' + errorBanner(e));
    });
  }

  function renderFlow(runId, data) {
    var failed = data.status === "failed";
    // A completed run walked every stage this build implements; a failed one
    // stopped somewhere, and saying where is the whole point of this tab.
    var reached = failed ? STAGE_ORDER.indexOf(data.failed_stage || "") : STAGE_ORDER.length - 1;
    if (reached < 0) reached = STAGE_ORDER.length - 1;
    setScreen(
      '<h1>Flow</h1>' +
      '<p class="sub">Run <code>' + h(runId) + "</code> — " + h(data.status || "complete") + ". Every stage below is one step of ARCHITECTURE §5's pipeline.</p>" +
      (failed ? '<div class="banner danger" role="alert">This run did not finish. The stepper stops at the stage that failed.</div>' : "") +
      '<div class="card flow-wrap">' + stepperHtml(reached, failed) + "</div>" +
      '<div class="stat-row section-gap">' +
      '<div class="card stat accent"><div class="k">Outcome</div><div class="v" style="font-size:16px">' + h(data.outcome || data.status || "—") + "</div></div>" +
      '<div class="card stat"><div class="k">Confidence</div><div class="v">' + (data.explain ? Number(data.explain.confidence.total).toFixed(2) : "—") + "</div></div>" +
      '<div class="card stat"><div class="k">Claims</div><div class="v">' + ((data.claims || []).length) + "</div></div>" +
      '<div class="card stat"><div class="k">Stages</div><div class="v">' + (reached + 1) + '<span class="unit"> of ' + STAGE_ORDER.length + "</span></div></div>" +
      "</div>" +
      '<p><a href="#/result/' + encodeURIComponent(runId) + '">See the full result →</a></p>'
    );
  }

  // =====================================================================
  // Usage — tokens, cost and latency
  // =====================================================================
  // Two honest sources, kept apart because they mean different things: the
  // last comparison (per-model tokens and latency the providers themselves
  // reported) and the run history (what each debate cost the ledger).
  // Nothing here is extrapolated from the other.
  function screenUsage() {
    setStatus("Ready", false);
    setScreen('<h1>Usage</h1><div class="card panel"><div class="skeleton"></div></div>');
    // The comparison half of this screen is already in memory, so a failing
    // run list degrades that one section to an inline error rather than
    // blanking a page that still has something true to show.
    api("/api/runs")
      .then(function (rows) { renderUsage(rows || [], null); })
      .catch(function (e) { renderUsage([], e); });
  }

  function renderUsage(runs, runsError) {
    var rows = lastCompare.rows;
    var totalTokens = rows.reduce(function (n, r) { return n + (r.total_tokens || 0); }, 0);
    var priced = rows.filter(function (r) { return r.cost_usd !== null && r.cost_usd !== undefined; });
    var totalCost = priced.reduce(function (n, r) { return n + r.cost_usd; }, 0);
    var slowest = rows.reduce(function (m, r) { return Math.max(m, r.elapsed_ms || 0); }, 0);
    var runCost = runs.reduce(function (n, r) { return n + (r.cost || 0); }, 0);

    function bars(title, sub, valueOf, format) {
      var max = rows.reduce(function (m, r) { return Math.max(m, valueOf(r)); }, 0) || 1;
      return '<div class="card chart-card">' +
        '<div class="k">' + h(title) + "</div><div class=\"sub2\">" + h(sub) + "</div>" +
        rows.map(function (r) {
          return '<div class="bar-row">' +
            '<span class="lbl"><span class="dot" style="background:' + colorOf(r.model) + '"></span>' + h(r.model) + "</span>" +
            '<span class="bar-track"><span class="bar-fill" style="width:' + ((valueOf(r) / max) * 100).toFixed(1) + "%;background:" + colorOf(r.model) + '"></span></span>' +
            '<span class="val">' + format(valueOf(r)) + "</span>" +
            "</div>";
        }).join("") +
        "</div>";
    }

    setScreen(
      '<h1>Usage</h1>' +
