      '<p class="sub">What the last comparison actually used, straight from what each provider reported. Costs are estimated from published list prices — the run ledger, not this page, is what accounts for a debate.</p>' +
      (rows.length === 0
        ? '<div class="card panel"><p class="empty-note">No comparison has run in this browser yet. <a href="#/compare">Ask a question</a> and its token, cost and latency breakdown appears here.</p></div>'
        : '<div class="stat-row">' +
          '<div class="card stat accent"><div class="k">Comparison cost</div><div class="v">' + fineMoney(totalCost) + "</div></div>" +
          '<div class="card stat"><div class="k">Tokens</div><div class="v">' + totalTokens + "</div></div>" +
          '<div class="card stat"><div class="k">Answers</div><div class="v">' + rows.length + "</div></div>" +
          '<div class="card stat"><div class="k">Slowest</div><div class="v">' + (slowest / 1000).toFixed(1) + '<span class="unit">s</span></div></div>' +
          "</div>" +
          '<div class="split" style="grid-template-columns:1fr 1fr">' +
          bars("Tokens per model", "Prompt plus completion, as the provider counted them", function (r) { return r.total_tokens || 0; }, function (v) { return v + " tok"; }) +
          bars("Latency per model", "Request sent to response complete", function (r) { return r.elapsed_ms || 0; }, function (v) { return (v / 1000).toFixed(1) + "s"; }) +
          "</div>" +
          '<div class="section-gap"></div>' +
          bars("Cost per model", "Estimated from published list prices, not billed amounts", function (r) { return r.cost_usd || 0; }, fineMoney) +
          '<p class="sub" style="margin-top:10px">Prompt: “' + h(lastCompare.prompt.slice(0, 120)) + (lastCompare.prompt.length > 120 ? "…" : "") + "”</p>"
      ) +
      '<div class="label section-gap">Debate spend</div>' +
      '<div class="card panel">' +
      (runsError
        ? errorBanner(runsError)
        : runs.length === 0
        ? '<p class="empty-note">No debates yet.</p>'
        : '<p class="sub" style="margin:0 0 10px">' + runs.length + " run" + (runs.length === 1 ? "" : "s") + ", " + money(runCost) + " total, as recorded by the budget ledger.</p>" +
          '<table><thead><tr><th>Question</th><th>Outcome</th><th>Cost</th></tr></thead><tbody>' +
          runs.slice(0, 10).map(function (r) {
            return '<tr><td><a href="#/result/' + encodeURIComponent(r.run_id) + '">' + h((r.question || "").slice(0, 60)) + "</a></td><td>" + h(r.outcome || r.status) + "</td><td>" + money(r.cost || 0) + "</td></tr>";
          }).join("") + "</tbody></table>") +
      "</div>"
    );
  }

  // =====================================================================
  // History
  // =====================================================================
  function screenHistory() {
    setStatus("Ready", false);
    setScreen('<h1>History</h1><div class="card panel"><div class="skeleton"></div><div class="skeleton"></div></div>');
    api("/api/runs").then(function (rows) {
      if (!rows.length) {
        setScreen('<h1>History</h1><div class="card panel"><p class="empty-note">No debates yet. <a href="#/new">Start your first one</a>, or try <a href="#/compare">Compare</a> — it needs one key and no setup.</p></div>');
        return;
      }
      renderHistory(rows);
    }).catch(function (e) { setScreen('<h1>History</h1>' + errorBanner(e)); });
  }

  function renderHistory(rows) {
    var outcomes = Array.from(new Set(rows.map(function (r) { return r.outcome; }).filter(Boolean)));
    var policies = Array.from(new Set(rows.map(function (r) { return r.policy_version; }).filter(Boolean)));
    setScreen(
      '<h1>History</h1>' +
      '<p class="sub">Every debate this store holds. Comparisons are not listed — they are not saved.</p>' +
      '<div class="card panel">' +
      '<div class="filters">' +
      '<label for="f-outcome" class="visually-hidden">Outcome</label>' +
      '<select id="f-outcome"><option value="">All outcomes</option>' + outcomes.map(function (o) { return '<option value="' + h(o) + '">' + h(o) + "</option>"; }).join("") + "</select>" +
      '<label for="f-policy" class="visually-hidden">Policy version</label>' +
      '<select id="f-policy"><option value="">All policy versions</option>' + policies.map(function (p) { return '<option value="' + h(p) + '">' + h(p) + "</option>"; }).join("") + "</select>" +
      '<span class="muted" style="font-size:12px">Decisions are only ever compared within one policy version — filter by it before comparing runs.</span>' +
      "</div>" +
      '<table><thead><tr><th>Question</th><th>Outcome</th><th>Confidence</th><th>Cost</th><th>Date</th></tr></thead><tbody id="history-body"></tbody></table>' +
      "</div>"
    );
    function render() {
      var o = document.getElementById("f-outcome").value;
      var p = document.getElementById("f-policy").value;
      var filtered = rows.filter(function (r) { return (!o || r.outcome === o) && (!p || r.policy_version === p); });
      document.getElementById("history-body").innerHTML = filtered.map(function (r) {
        return '<tr><td><a href="#/result/' + encodeURIComponent(r.run_id) + '">' + h(r.question).slice(0, 80) + "</a></td>" +
          "<td>" + h(r.outcome || r.status) + "</td>" +
          "<td>" + (r.confidence != null ? Number(r.confidence).toFixed(2) : "—") + "</td>" +
          "<td>" + money(r.cost || 0) + (r.orphaned_cost ? ' <span class="muted">(+' + money(r.orphaned_cost) + " orphaned)</span>" : "") + "</td>" +
          "<td>" + h(r.started_at) + "</td></tr>";
      }).join("") || '<tr><td colspan="5" class="muted">(no runs match)</td></tr>';
    }
    document.getElementById("f-outcome").addEventListener("change", render);
    document.getElementById("f-policy").addEventListener("change", render);
    render();
  }

  // =====================================================================
  // Keys
  // =====================================================================
  function screenKeys() {
    setStatus("Ready", false);
    setScreen('<h1>Keys</h1><div class="card panel"><div class="skeleton"></div></div>');
    api("/api/providers").then(function (data) {
      renderKeys(data.providers || []);
    }).catch(function (e) { setScreen('<h1>Keys</h1>' + errorBanner(e)); });
  }

  function renderKeys(providers) {
    var real = providers.filter(function (p) { return p.state !== "not_required"; });
    var rows = real.map(function (p) {
      var dot = p.state === "verified" ? "ok" : (p.state === "present" || p.state === "blocked") ? "warn" : "off";
      return '<tr id="key-row-' + h(p.id) + '"><td><span class="dot" style="background:' + colorOf(p.id) + '"></span> ' + h(p.id) + "</td>" +
        '<td><span class="dot ' + dot + '" aria-hidden="true"></span> <span class="key-state">' + h(p.state) + "</span></td>" +
        "<td>" + (p.source ? h(p.source) : "—") + "</td>" +
        "<td>" + (p.fingerprint ? "…" + h(p.fingerprint) : "—") + "</td>" +
        '<td style="white-space:nowrap">' +
        '<button type="button" class="link" data-setkey="' + h(p.id) + '">' + (p.state === "missing" ? "Add key" : "Replace key") + "</button>" +
        ' · <button type="button" class="link" data-recheck="' + h(p.id) + '">Test</button>' +
        "</td></tr>" +
        // The form and the result share a row of their own beneath the
        // provider's, so revealing one never reflows the table's columns.
        '<tr class="key-detail" id="key-detail-' + h(p.id) + '" hidden><td colspan="5"></td></tr>';
    }).join("");

    setScreen(
      '<h1>Keys</h1>' +
      '<p class="sub">Which providers can be called, and where their key came from. A key is never shown, only its last four characters.</p>' +
      '<div class="model-row">' + providers.filter(function (p) { return p.id !== "mock"; }).map(modelCardHtml).join("") + "</div>" +
      (real.length === 0
        ? '<div class="banner warn">No provider keys are configured yet. Set one in the terminal you launch from, then reload this page.</div>'
        : "") +
      '<div class="card panel">' +
      '<table><thead><tr><th>Provider</th><th>State</th><th>Source</th><th>Fingerprint</th><th></th></tr></thead><tbody>' + rows + "</tbody></table>" +
      "</div>" +
      '<div class="card panel section-gap">' +
      '<div class="ptitle">Where a key is read from</div>' +
      '<p class="sub" style="margin:0 0 8px">In order: 1) <code>ARBITER_&lt;PROVIDER&gt;_API_KEY</code> 2) the provider\'s own conventional variable (<code>OPENAI_API_KEY</code> and so on) 3) the OS keychain.</p>' +
      '<p class="sub" style="margin:0 0 12px">Config files are <strong>never</strong> read for a key — an <code>api_key</code> value found in one fails the run outright.</p>' +
      '<div class="log" style="max-height:none">' +
      "<div>PowerShell&nbsp;&nbsp;$env:ANTHROPIC_API_KEY = &quot;sk-ant-…&quot;</div>" +
      "<div>bash/zsh&nbsp;&nbsp;&nbsp;&nbsp;export ANTHROPIC_API_KEY=&quot;sk-ant-…&quot;</div>" +
      "<div>keychain&nbsp;&nbsp;&nbsp;&nbsp;arbiter keys set anthropic</div>" +
      "</div>" +
      '<p class="sub" style="margin:12px 0 0">Or use <strong>Add key</strong> above to store one in the OS keychain from here. A key set as an environment variable wins over the keychain, and only applies to the terminal you launch from.</p>' +
      "</div>"
    );

    function detailCell(id) {
      var row = document.getElementById("key-detail-" + id);
      return { row: row, cell: row.querySelector("td") };
    }
    function showDetail(id, html) {
      var d = detailCell(id);
      d.cell.innerHTML = html;
      d.row.hidden = false;
    }

    // ---- Test: one real, minimal request through the adapter. The endpoint
    // answers 200 with a state even when the vendor refused the key, because
    // "refused" is a fact it successfully established.
    app.querySelectorAll("[data-recheck]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-recheck");
        btn.disabled = true;
        var original = btn.textContent;
        btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Testing…';
        showDetail(id, '<span class="muted">Sending one minimal request to ' + h(id) + "…</span>");
        api("/api/providers/" + encodeURIComponent(id) + "/test", { method: "POST" })
          .then(function (r) {
            btn.disabled = false;
            btn.textContent = original;
            var kind = r.state === "verified" ? "ok" : r.state === "rejected" ? "danger" : "warn";
            showDetail(id,
              '<div class="banner ' + kind + '" role="status">' +
              "<strong>" + h(r.headline) + "</strong>" +
              (r.detail ? '<br><span class="mono" style="font-size:11.5px">' + h(r.detail) + "</span>" : "") +
              (r.status ? '<br><span class="muted" style="font-size:11px">HTTP ' + h(r.status) + "</span>" : "") +
              "</div>");
            var stateEl = document.querySelector("#key-row-" + CSS.escape(id) + " .key-state");
            if (stateEl) stateEl.textContent = r.state;
          })
          .catch(function (e) {
            btn.disabled = false;
            btn.textContent = original;
            showDetail(id, errorBanner(e));
          });
      });
    });

    // ---- Add / replace a key. `type="password"` with autocomplete off: the
    // value must not be shoulder-readable, and a browser has no business
    // remembering it. It is POSTed in a body, never a URL.
    app.querySelectorAll("[data-setkey]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var id = btn.getAttribute("data-setkey");
        var row = providers.filter(function (p) { return p.id === id; })[0] || {};
        var consoleUrl = row.console_url;
        showDetail(id,
          '<form class="key-form" data-provider="' + h(id) + '">' +
          '<label for="key-input-' + h(id) + '">API key for ' + h(id) + "</label>" +
          '<div class="row" style="align-items:flex-end">' +
          '<input type="password" id="key-input-' + h(id) + '" autocomplete="off" spellcheck="false" placeholder="paste the key">' +
          '<div style="flex:0 0 auto"><button type="submit" class="btn-primary">Save to keychain</button> ' +
          '<button type="button" class="ghost" data-cancel>Cancel</button></div>' +
          "</div>" +
          '<p class="sub" style="margin:8px 0 0">Stored in the OS keychain, the same place <code>arbiter keys set</code> puts it. Never written to a file here, never shown again.' +
          (consoleUrl ? ' <a href="' + h(consoleUrl) + '" target="_blank" rel="noopener noreferrer">Get a key for ' + h(id) + " →</a>" : "") + "</p>" +
          '<div class="key-form-msg"></div>' +
          "</form>");
        var form = document.querySelector("#key-detail-" + CSS.escape(id) + " .key-form");
        var input = document.getElementById("key-input-" + id);
        if (input) input.focus();
        form.querySelector("[data-cancel]").addEventListener("click", function () {
          detailCell(id).row.hidden = true;
        });
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var value = input.value;
          var msg = form.querySelector(".key-form-msg");
          if (!value.trim()) {
            msg.innerHTML = '<p class="field-error">Paste a key first.</p>';
            return;
          }
          var save = form.querySelector("button[type=submit]");
          save.disabled = true;
          save.innerHTML = '<span class="spinner" aria-hidden="true"></span>Saving…';
          api("/api/providers/" + encodeURIComponent(id) + "/key", { method: "POST", body: { key: value } })
            .then(function (r) {
              // Clear the field before anything else: there is no reason for
              // the key to stay in the DOM once it is in the keychain.
              input.value = "";
              if (r && r.shadowed_by) {
                // Saved, but an environment variable still outranks it. Left
                // unsaid, the operator sees the screen reload unchanged and
                // concludes the form is broken.
                showDetail(id,
                  '<div class="banner warn" role="alert"><strong>Saved to the keychain — but ' + h(r.shadowed_by) + " is still what gets used.</strong>" +
                  '<br><span class="muted">The environment is read before the keychain. Unset that variable in the terminal you launched from, then restart, for the key you just saved to take effect.</span></div>');
                return;
              }
              screenKeys();
            })
            .catch(function (e) {
              save.disabled = false;
              save.textContent = "Save to keychain";
              msg.innerHTML = errorBanner(e);
            });
        });
      });
    });
  }

  route();
})();
</script>
</body>
</html>
