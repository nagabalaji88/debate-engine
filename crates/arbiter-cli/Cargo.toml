[package]
name = "arbiter-cli"
description = "The only frontend in phase 1: the arbiter binary, and arbiter serve, the minimal loopback UI. Depends on kernel, store and providers; nothing depends on this crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "arbiter"
path = "src/main.rs"

[dependencies]
arbiter-core = { workspace = true }
arbiter-store = { workspace = true }
arbiter-kernel = { workspace = true }
arbiter-providers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints.rust]
missing_debug_implementations = "warn"
